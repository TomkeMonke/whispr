<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>whispr</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app">
      <header class="topbar">
        <h1>whispr</h1>
        <button id="settings-toggle" class="icon-btn" type="button" title="Settings">
          settings
        </button>
      </header>

      <section id="settings" class="settings" hidden>
        <div class="field">
          <span>Hotkey</span>
          <div class="inline">
            <input id="hotkey" type="text" spellcheck="false" autocomplete="off" />
            <button id="save-hotkey" class="btn" type="button">Set</button>
          </div>
          <small id="hotkey-status" class="hint">
            Works in any app. Tap to start and stop, or hold to talk
          </small>
          <label class="check">
            <input id="auto-paste" type="checkbox" />
            <span>Paste into the app you are typing in</span>
          </label>
          <small class="hint">Off: the text is copied to the clipboard instead</small>
          <label class="check">
            <input id="autostart" type="checkbox" />
            <span>Start when you log in</span>
          </label>
          <small id="autostart-hint" class="hint">Opens straight to the tray, hotkey ready</small>
        </div>

        <label class="field">
          <span>Engine</span>
          <select id="engine">
            <option value="cloud">Groq cloud - fastest, needs a key</option>
            <option value="local">Local - private, works offline</option>
          </select>
          <small class="hint">The other engine takes over if this one fails</small>
        </label>

        <div class="field">
          <span>Local model</span>
          <div class="inline">
            <select id="local-model"></select>
            <button id="download-model" class="btn" type="button">Download</button>
          </div>
          <progress id="download-progress" max="1" value="0" hidden></progress>
          <small id="local-status" class="hint"></small>
        </div>

        <label class="field">
          <span>Groq API key</span>
          <div class="inline">
            <input
              id="api-key"
              type="password"
              placeholder="gsk_..."
              autocomplete="off"
              spellcheck="false"
            />
            <button id="save-key" class="btn" type="button">Save</button>
          </div>
          <small id="key-status" class="hint"></small>
          <small class="hint">
            No key yet?
            <a href="#" id="groq-link">Create one at console.groq.com</a> - the free
            tier covers 8 hours of audio a day.
          </small>
        </label>

        <label class="field">
          <span>Microphone</span>
          <select id="mic"></select>
        </label>

        <label class="field">
          <span>Groq model</span>
          <select id="model">
            <option value="whisper-large-v3-turbo">
              Turbo - fast, cheap (default)
            </option>
            <option value="whisper-large-v3">
              Large v3 - slower, most accurate
            </option>
          </select>
        </label>
      </section>

      <section class="stage">
        <button id="record" class="record" type="button" aria-label="Start recording">
          <span id="level-ring" class="ring"></span>
          <span class="dot"></span>
        </button>
        <p id="status" class="status">Loading...</p>
        <p id="kbd-hint" class="hint kbd-hint">Space to start and stop</p>
      </section>

      <section class="result">
        <textarea
          id="transcript"
          placeholder="Your transcript will appear here"
          spellcheck="false"
        ></textarea>
        <div class="result-actions">
          <span id="meta" class="hint"></span>
          <button id="copy" class="btn" type="button" disabled>Copy</button>
        </div>
      </section>

      <p id="error" class="error" hidden></p>
    </main>
  </body>
</html>
